[project]
name = "ai-chat"
version = "0.1.0"
description = "FastAPI AI chat worker on Cloudflare Workers — NIM-backed, SSE streaming, per-IP rate limited"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]