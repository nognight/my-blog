<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="28" fill="#0a0f0a"/>
  <rect x="8" y="8" width="112" height="112" rx="20" fill="#0d1a0d" stroke="#1aff66" stroke-width="2" stroke-opacity="0.3"/>
  <!-- pixel grid -->
  <g opacity="0.08" stroke="#1aff66" stroke-width="1">
    <line x1="32" y1="8" x2="32" y2="120"/><line x1="64" y1="8" x2="64" y2="120"/><line x1="96" y1="8" x2="96" y2="120"/>
    <line x1="8" y1="32" x2="120" y2="32"/><line x1="8" y1="64" x2="120" y2="64"/><line x1="8" y1="96" x2="120" y2="96"/>
  </g>
  <!-- Matrix M - pixel style -->
  <g fill="#00ff66">
    <!-- left leg -->
    <rect x="28" y="36" width="18" height="56" rx="2"/>
    <!-- right leg -->
    <rect x="82" y="36" width="18" height="56" rx="2"/>
    <!-- middle V -->
    <rect x="36" y="48" width="14" height="14" rx="2" transform="rotate(35 43 55)"/>
    <rect x="78" y="48" width="14" height="14" rx="2" transform="rotate(-35 85 55)"/>
    <polygon points="64,78 46,52 52,48 64,68 76,48 82,52" fill="#00ff66"/>
  </g>
  <!-- code rain dots -->
  <g fill="#00ff66" opacity="0.9">
    <rect x="60" y="22" width="8" height="8" rx="1.5"/><rect x="60" y="100" width="8" height="8" rx="1.5"/>
  </g>
  <g fill="#00ff88" opacity="0.5">
    <rect x="22" y="26" width="4" height="4" rx="1"/><rect x="102" y="26" width="4" height="4" rx="1"/>
    <rect x="22" y="98" width="4" height="4" rx="1"/><rect x="102" y="98" width="4" height="4" rx="1"/>
  </g>
</svg>
